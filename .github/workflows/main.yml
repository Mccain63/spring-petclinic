on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. Exécuter tous les outils de mesure
      - name: Run Quality, Complexity and Security Analysis
        run: |
          ./gradlew checkstyleMain jacocoTestReport dependencyCheckAnalyze

      # 2. RÉCUPÉRER LES RAPPORTS (L'étape cruciale !)
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            build/reports/checkstyle/
            build/reports/jacoco/
